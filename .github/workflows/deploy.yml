# Uploads the site to GoDaddy over FTP on every push to main.
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (an FTP account rooted at the cPanel home folder).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip until FTP secrets are set
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets are not set yet, nothing deployed."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Upload app (outside the web root)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: flowsuit-app/

      - name: Upload public site
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: public_html/
