# Uploads the site to GoDaddy over FTP on every push to main.
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (an FTP account rooted at the cPanel home folder).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip until FTP secrets are set
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets are not set yet, nothing deployed."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Install PHP libraries (Claude SDK for the chat)
        if: env.FTP_SERVER != ''
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --working-dir=app
          cd app/vendor && zip -qr -9 ../vendor.zip . -x '*/.git/*' '*/tests/*' '*/docs/*' '*/examples/*' '*/fixtures/*' '*/libraries/*'

      - name: Upload app (outside the web root)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: flowsuit-app/
          # vendor/ goes up as vendor.zip and is unpacked on the server by app/chat.php.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**

      - name: Upload public site
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: public_html/

      # Test site (test.flowsuit.net): the same public files plus a .flowsuit-test marker, so the ERP there keeps its
      # records in ~/flowsuit-test-data (a copy of live) and never writes to the live data. Needs the "test" subdomain
      # in cPanel with document root test.flowsuit.net.
      - name: Prepare test site files
        if: env.FTP_SERVER != ''
        run: |
          mkdir -p _testsite && cp -a public/. _testsite/ && echo "test" > _testsite/.flowsuit-test

      - name: Upload test site
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_testsite/
          server-dir: test.flowsuit.net/
